# /etc/nut/upssched.conf
# Mất điện → đếm 180 s. Có điện lại trước khi hết giờ → huỷ, không tắt gì.
CMDSCRIPT /opt/homelab/bin/nut-upssched-cmd.sh
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

AT ONBATT   * START-TIMER  onbatt_shutdown 180
AT ONLINE   * CANCEL-TIMER onbatt_shutdown

AT ONBATT   * EXECUTE notify_onbatt
AT ONLINE   * EXECUTE notify_online
AT LOWBATT  * EXECUTE notify_lowbatt
AT FSD      * EXECUTE notify_fsd
AT COMMBAD  * EXECUTE notify_commbad
AT COMMOK   * EXECUTE notify_commok
AT NOCOMM   * EXECUTE notify_nocomm
AT REPLBATT * EXECUTE notify_replbatt
