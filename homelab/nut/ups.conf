# /etc/nut/ups.conf — CyberPower VP1600ELCD cắm USB vào homeserver.
# Kiểm driver: sudo nut-scanner -U  (phải thấy usbhid-ups, vendorid 0764)
[ups]
  driver = usbhid-ups
  port = auto
  vendorid = 0764
  desc = "CyberPower VP1600ELCD - server + NAS + Deco"
  # Khi server tắt hẳn: UPS cắt điện ổ cắm sau 60 s, có điện lưới lại thì bật lại sau 120 s
  # → server và NAS tự khởi động (cần bật "power on after AC loss" trong BIOS/UGOS).
  # ondelay phải lớn hơn offdelay.
  offdelay = 60
  ondelay = 120
