# Docker khởi động SAU khi các mount mạng (NFS /srv/nas) đã sẵn sàng.
# Dùng Wants (không phải Requires): NAS hỏng thì finance-dashboard, knowledge_db... vẫn chạy;
# Immich sẽ tự từ chối khởi động vì thiếu file .immich trong thư mục rỗng bị khoá (chattr +i).
[Unit]
After=remote-fs.target
Wants=remote-fs.target
