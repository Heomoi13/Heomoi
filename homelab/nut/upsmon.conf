# /etc/nut/upsmon.conf — quyền 640, owner root:nut.
RUN_AS_USER nut
MONITOR ups@localhost 1 upsmon_local CHANGE_ME_LOCAL primary
MINSUPPLIES 1

# Lệnh tắt cuối cùng của server (chạy bằng root). Tự dừng container + gỡ NFS nếu bước "fsd" chưa làm.
SHUTDOWNCMD "/opt/homelab/bin/nut-shutdown.sh final"

# Mọi sự kiện chuyển cho upssched (đếm giờ 3 phút + nhắn Telegram)
NOTIFYCMD /usr/sbin/upssched
NOTIFYFLAG ONLINE   SYSLOG+EXEC
NOTIFYFLAG ONBATT   SYSLOG+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+EXEC
NOTIFYFLAG FSD      SYSLOG+EXEC
NOTIFYFLAG COMMOK   SYSLOG+EXEC
NOTIFYFLAG COMMBAD  SYSLOG+EXEC
NOTIFYFLAG NOCOMM   SYSLOG+EXEC
NOTIFYFLAG REPLBATT SYSLOG+EXEC

POLLFREQ 5
POLLFREQALERT 5
DEADTIME 25
# Thời gian chờ NAS (secondary) ngắt kết nối khi có FSD trước khi server tắt
HOSTSYNC 60
POWERDOWNFLAG /etc/killpower
FINALDELAY 5
