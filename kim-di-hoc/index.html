<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bé Kim Đi Học</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen picture book — header, speech bubble, a room scene with Kim, a tray of big choice cards. Single bright look on purpose. */
:root {
  color-scheme: light;
  --bg: #e3f1fb;        /* morning-sky wall */
  --paper: #ffffff;
  --ink: #2b2a4a;       /* Kim's star-pants navy */
  --ink-soft: #5d5b80;
  --lemon: #ffd84d;     /* the lemon on her tee */
  --mint: #bfe9d6;      /* her tee */
  --coral: #ff7a7a;
  --good: #33b679;
  --shadow: 0 6px 0 rgba(43,42,74,.16);
  --font: "Baloo 2", "Nunito", "Segoe UI Rounded", system-ui, sans-serif;
  --r: 28px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button { font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible { outline: 5px solid var(--lemon); outline-offset: 3px; }

#app {
  height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1100px; margin: 0 auto;
}
.bar { display: flex; align-items: center; gap: 12px; }
.round {
  width: 64px; height: 64px; flex: none; border-radius: 50%; background: var(--paper);
  font-size: 32px; box-shadow: var(--shadow); display: grid; place-items: center;
}
.round:active { transform: translateY(4px); }
.title { flex: 1; min-width: 0; text-align: center; font-weight: 800; line-height: 1; font-size: clamp(24px, 5.5vw, 44px); text-wrap: balance; }
.title em { font-style: normal; color: var(--coral); }

.guide { display: flex; align-items: center; gap: 10px; }
.face-badge { width: 58px; height: 58px; flex: none; border-radius: 50%; background: var(--paper); box-shadow: var(--shadow); overflow: hidden; }
.face-badge svg { width: 100%; height: 100%; }
.bubble {
  flex: 1; min-width: 0; background: var(--paper); border-radius: 22px; padding: 10px 16px; text-align: left;
  font-size: clamp(18px, 3.6vw, 26px); font-weight: 700; line-height: 1.25; position: relative; box-shadow: var(--shadow);
}
.bubble::before { content: ""; position: absolute; left: -12px; top: 50%; translate: 0 -50%; border: 10px solid transparent; border-right: 14px solid var(--paper); border-left: 0; }
.bubble .again { float: right; font-size: 24px; margin-left: 8px; opacity: .7; }

.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.scene { flex: 1; min-height: 0; position: relative; border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }

/* the room: wall + colourful foam puzzle mat */
.room { position: absolute; inset: 0; background: #f4ead9; }
.room::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%;
  background:
    conic-gradient(from 0deg at 50% 50%, #4a7bd0 0 25%, #e8524a 0 50%, #ffcf3a 0 75%, #49b36b 0) 0 0 / 160px 160px; }
.room::after { content: ""; position: absolute; left: 0; right: 0; bottom: 30%; height: 8px; background: #d8c8ae; }
.window {
  position: absolute; top: 7%; left: 5%; width: clamp(110px, 22%, 210px); aspect-ratio: 1.1; max-width: 100%;
  border: 10px solid #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 0 rgba(0,0,0,.1);
  background: var(--sky, #8fd3ff);
}
.window::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent calc(50% - 4px), #fff 0 calc(50% + 4px), transparent 0); }
.window .wx { position: absolute; left: 50%; top: 50%; translate: -50% -50%; font-size: clamp(44px, 8vw, 80px); line-height: 1; }
.sunspin { animation: spin 12s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.drop { position: absolute; top: -20%; width: 3px; height: 18px; background: #e8f6ff; border-radius: 2px; animation: rain .7s linear infinite; }
@keyframes rain { to { transform: translateY(260px); } }
.leaf { position: absolute; font-size: 22px; animation: blow 2.4s linear infinite; }
@keyframes blow { from { transform: translate(-40px, 0) rotate(0); } to { transform: translate(240px, 50px) rotate(360deg); } }

.kim { position: absolute; bottom: 3%; left: 50%; height: 92%; translate: -50% 0; max-width: 70%; overflow: visible; }
.eyes { animation: blinkEye 4.5s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes blinkEye { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.hop { animation: hop .5s ease-out; }
@keyframes hop { 40% { transform: translateY(-6%); } }

.chips { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
.chip { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.75); border: 3px dashed #c9c3e0; display: grid; place-items: center; font-size: 24px; }
.chip.on { border: 3px solid var(--lemon); background: #fff; }
.chip.got { border: 3px solid var(--good); background: #fff; }

.tray { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
.card {
  width: clamp(96px, 22vw, 150px); aspect-ratio: 1; max-width: 100%; border-radius: 26px; background: var(--paper); box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; position: relative;
  transition: transform .12s;
}
.card svg { width: 100%; flex: 1; min-height: 0; }
.card small { font-size: clamp(14px, 2.4vw, 18px); font-weight: 800; line-height: 1.1; text-align: center; }
.card:active { transform: translateY(4px); }
.card .emo { font-size: clamp(48px, 9vw, 72px); line-height: 1; flex: 1; display: grid; place-items: center; }
.card .stars { position: absolute; top: -10px; right: -6px; font-size: 26px; }
.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-10px) rotate(-4deg); } 40%, 80% { transform: translateX(10px) rotate(4deg); } }
.picked { outline: 5px solid var(--good); }
.nudge { animation: nudge 1.1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: scale(1.07); } }
.big-btn { height: 92px; padding: 0 30px; border-radius: 46px; background: var(--coral); color: #fff; font-size: clamp(24px, 4.5vw, 34px); font-weight: 800; box-shadow: 0 7px 0 #cf5656; }
.big-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #cf5656; }

/* packing */
.item {
  position: absolute; translate: -50% -50%; width: clamp(76px, 13vw, 110px); aspect-ratio: 1; border-radius: 24px;
  background: #fff; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: clamp(38px, 7vw, 58px); line-height: 1; z-index: 2;
  transition: left .6s cubic-bezier(.4,0,.6,1), top .6s cubic-bezier(.4,0,.6,1), transform .6s, opacity .6s;
}
.item small { font-size: clamp(12px, 2vw, 15px); font-weight: 800; margin-top: 2px; }
.bag { position: absolute; right: 6%; bottom: 4%; height: 50%; aspect-ratio: .9; max-width: 45%; }
.bag svg { width: 100%; height: 100%; overflow: visible; }
.bump { animation: bump .35s; transform-origin: bottom center; }
@keyframes bump { 50% { transform: scale(1.1, .92); } }
.count { position: absolute; top: -6%; right: -6%; background: var(--good); color: #fff; border-radius: 50%; width: 52px; height: 52px; display: grid; place-items: center; font-size: 30px; font-weight: 800; }

/* school */
.school { position: absolute; inset: 0; background: linear-gradient(#bfe6ff 0 58%, #8fd17a 58% 66%, #e9d7b8 66%); }
.building { position: absolute; left: 50%; translate: -50% 0; bottom: 34%; width: min(78%, 560px); height: 44%; background: #fff3c4; border-radius: 10px 10px 0 0; box-shadow: inset 0 -10px 0 rgba(0,0,0,.06); }
.building::before { content: ""; position: absolute; left: -6%; right: -6%; top: -30%; height: 34%; background: #e8604c; clip-path: polygon(8% 100%, 50% 0, 92% 100%); }
.building .sign { position: absolute; left: 50%; top: 10%; translate: -50% 0; background: #2f5aa8; color: #fff; font-weight: 800; border-radius: 10px; padding: 2px 12px; font-size: clamp(13px, 2.4vw, 22px); white-space: nowrap; }
.building .door { position: absolute; left: 50%; bottom: 0; translate: -50% 0; width: 20%; height: 48%; background: #8d5a3b; border-radius: 40px 40px 0 0; }
.building .win { position: absolute; top: 42%; width: 16%; height: 26%; background: #8fd3ff; border: 5px solid #fff; border-radius: 8px; }
.teacher { position: absolute; right: 8%; bottom: 8%; font-size: clamp(80px, 16vw, 150px); line-height: 1; }
.say { position: absolute; background: #fff; border-radius: 18px; padding: 6px 14px; font-weight: 800; font-size: clamp(16px, 3vw, 24px); box-shadow: var(--shadow); animation: pop .4s; }

/* start + party */
.start { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
.start .portrait { height: min(42vh, 340px); }
.start h1 { margin: 0; font-size: clamp(38px, 8vw, 72px); line-height: 1; font-weight: 800; }
.start h1 em { font-style: normal; color: var(--coral); }
.start p { margin: 0; font-size: clamp(18px, 3vw, 24px); color: var(--ink-soft); max-width: 28em; }
.play { width: 140px; height: 140px; border-radius: 50%; background: var(--coral); color: #fff; font-size: 64px; box-shadow: 0 10px 0 #cf5656; animation: nudge 1.4s ease-in-out infinite; }
.party { position: fixed; inset: 0; z-index: 40; background: rgba(43,42,74,.55); display: grid; place-items: center; padding: 20px; }
.party .box { background: #fff; border-radius: 36px; padding: 24px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; animation: pop .5s; box-shadow: 0 12px 0 rgba(0,0,0,.2); }
.party .big { font-size: 100px; line-height: 1; }
.party h2 { margin: 0; font-size: clamp(30px, 6vw, 48px); line-height: 1.05; }
.party .round { width: 90px; height: 90px; font-size: 46px; background: var(--lemon); }
@keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
.confetti { position: fixed; top: -60px; font-size: 40px; z-index: 45; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }
.sparkle { position: absolute; font-size: 44px; pointer-events: none; translate: -50% -50%; animation: rise 1s ease-out forwards; z-index: 3; }
@keyframes rise { to { transform: translateY(-70px) scale(1.4); opacity: 0; } }

@media (max-width: 560px) and (orientation: portrait) {
  .round { width: 54px; height: 54px; font-size: 26px; }
  .face-badge { width: 48px; height: 48px; }
  .chip { width: 36px; height: 36px; font-size: 19px; }
  .kim { max-width: 88%; }
  .tray { gap: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button class="round" id="homeBtn" aria-label="Về màn hình chính" hidden>🏠</button>
    <div class="title" id="title">Bé Kim <em>Đi Học</em></div>
    <button class="round" id="soundBtn" aria-label="Bật hoặc tắt tiếng">🔊</button>
  </div>
  <div class="guide">
    <div class="face-badge" id="badge" aria-hidden="true"></div>
    <button class="bubble" id="bubble" aria-live="polite"><span class="again" aria-hidden="true">🔁</span><span id="bubbleText">Chào bé!</span></button>
  </div>
  <div class="stage" id="stage"></div>
</div>

<div class="start" id="start">
  <div class="portrait" id="portrait"></div>
  <h1>Bé Kim <em>Đi Học</em></h1>
  <p>Giúp Kim chọn quần áo hợp thời tiết và chuẩn bị cặp sách để đến trường.</p>
  <button class="play" id="playBtn" aria-label="Bắt đầu chơi">▶</button>
</div>

<script>
(() => {
"use strict";

/* ================= storage (best effort) ================= */
const KEY = "kim-di-hoc-v1";
let stars = {};
try { stars = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
const saveStars = () => { try { localStorage.setItem(KEY, JSON.stringify(stars)); } catch (e) {} };

/* ================= sound ================= */
let soundOn = true, actx = null;
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function tone(f, dur = .15, type = "sine", vol = .2, at = 0, f2) {
  if (!soundOn) return; const c = ac(); if (!c) return;
  const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  tap: () => tone(700, .08, "triangle", .15),
  pop: () => tone(500, .12, "sine", .25, 0, 1000),
  swish: () => tone(1400, .25, "sine", .08, 0, 400),
  ding: () => { tone(880, .25, "sine", .2); tone(1320, .35, "sine", .15, .12); },
  oops: () => tone(320, .22, "sine", .15, 0, 220),
  cheer: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .22, "triangle", .2, i * .11)),
  plop: () => { tone(300, .1, "sine", .3, 0, 120); tone(900, .1, "triangle", .08, .05); },
  bell: () => [1047, 1319, 1568].forEach((f, i) => tone(f, .5, "sine", .14, i * .18)),
};

/* ================= voice ================= */
let viVoice = null;
function pickVoice() { if ("speechSynthesis" in window) viVoice = speechSynthesis.getVoices().find(v => /^vi/i.test(v.lang)) || null; }
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let lastLine = "";
function say(text, then) {
  lastLine = text; document.getElementById("bubbleText").textContent = text;
  if (!soundOn || !("speechSynthesis" in window)) { if (then) later(then, 700 + text.length * 45); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[^\p{L}\p{N}\s.,!?]/gu, ""));
    u.lang = "vi-VN"; if (viVoice) u.voice = viVoice; u.rate = .92; u.pitch = 1.2;
    let fired = false; const go = () => { if (!fired) { fired = true; then && then(); } };
    u.onend = go; u.onerror = go; if (then) later(go, 1500 + text.length * 90);
    speechSynthesis.speak(u);
  } catch (e) { if (then) later(then, 800); }
}

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const stage = $("#stage");
let timers = [];
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
const h = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function sparkle(parent, x, y, ch = "✨") { const s = h(`<div class="sparkle">${ch}</div>`); s.style.left = x; s.style.top = y; parent.appendChild(s); setTimeout(() => s.remove(), 1000); }

/* ================= Kim ================= */
const SKIN = "#f9dcc8", HAIR = "#1c1a24", CHEEK = "#f4a1a1";
const TEE = "M84 158 Q120 150 156 158 L182 184 L168 202 L160 196 L160 264 L80 264 L80 196 L72 202 L58 184 Z";
const star = (x, y) => `<text x="${x}" y="${y}" font-size="10" fill="#ffd84d">★</text>`;
const CLOTHES = {
  /* tops */
  home: { name: "Áo ở nhà", body: `<path d="${TEE}" fill="#bfe9d6"/><path d="M58 184 L72 202 M182 184 L168 202" stroke="#f6b8c4" stroke-width="5"/><path d="M102 156 Q120 170 138 156" stroke="#f6b8c4" stroke-width="4" fill="none"/><ellipse cx="138" cy="216" rx="12" ry="9" fill="#ffd84d"/><ellipse cx="142" cy="205" rx="6" ry="3" fill="#5bb36a"/>` },
  uniform: { name: "Áo đồng phục", body: `<path d="${TEE}" fill="#ffffff" stroke="#cfd6e3" stroke-width="2"/><path d="M102 155 L120 170 L104 182 Q94 170 102 155 Z M138 155 L120 170 L136 182 Q146 170 138 155 Z" fill="#2f5aa8"/><circle cx="120" cy="194" r="3" fill="#2f5aa8"/><circle cx="120" cy="214" r="3" fill="#2f5aa8"/><circle cx="120" cy="234" r="3" fill="#2f5aa8"/><rect x="134" y="198" width="16" height="12" rx="3" fill="#e8524a"/>` },
  pink: { name: "Áo hồng", body: `<path d="${TEE}" fill="#ff9ec4"/><path d="M120 228 C100 214 104 198 113 198 C117 198 120 202 120 204 C120 202 123 198 127 198 C136 198 140 214 120 228 Z" fill="#fff"/>` },
  swim: { name: "Đồ bơi", body: `<path d="M90 160 L100 160 Q120 182 140 160 L150 160 L150 222 Q154 250 162 262 L78 262 Q86 250 90 222 Z" fill="#3fc1c9"/><g fill="#fff"><circle cx="104" cy="214" r="4"/><circle cx="134" cy="232" r="4"/><circle cx="116" cy="246" r="4"/><circle cx="138" cy="204" r="4"/></g>` },
  /* bottoms */
  pj: { name: "Quần ngủ", body: `<path d="M80 250 L160 250 L162 352 L124 352 L120 282 L116 352 L78 352 Z" fill="#26294f"/>${star(86, 280)}${star(100, 310)}${star(84, 336)}${star(130, 296)}${star(146, 326)}${star(140, 270)}${star(108, 266)}` },
  shorts: { name: "Quần soóc", body: `<path d="M80 250 L160 250 L164 306 L124 306 L120 280 L116 306 L76 306 Z" fill="#2f5aa8"/><path d="M80 258 L160 258" stroke="#244a8c" stroke-width="3"/>` },
  skirt: { name: "Chân váy", body: `<path d="M82 250 L158 250 L176 310 L64 310 Z" fill="#e8524a"/><path d="M100 252 L92 308 M120 252 L120 308 M140 252 L148 308" stroke="#c63f39" stroke-width="2.5"/><g fill="#fff"><circle cx="90" cy="280" r="3"/><circle cx="132" cy="270" r="3"/><circle cx="150" cy="296" r="3"/><circle cx="110" cy="296" r="3"/></g>` },
  /* shoes */
  sneakers: { name: "Giày", body: [0, 30].map(d => `<path d="M${88 + d} 366 Q${88 + d} 346 ${104 + d} 346 Q${121 + d} 348 ${122 + d} 366 Z" fill="#fff" stroke="#4a5a7a" stroke-width="2.5"/><rect x="${86 + d}" y="362" width="38" height="8" rx="4" fill="#4aa3df"/><path d="M${98 + d} 352 L${110 + d} 352 M${98 + d} 357 L${112 + d} 357" stroke="#4aa3df" stroke-width="2.5"/>`).join("") },
  boots: { name: "Ủng", body: [0, 30].map(d => `<rect x="${92 + d}" y="312" width="26" height="54" rx="9" fill="#ffcf33" stroke="#d9a600" stroke-width="2"/><ellipse cx="${106 + d}" cy="363" rx="17" ry="8" fill="#ffcf33" stroke="#d9a600" stroke-width="2"/><rect x="${92 + d}" y="318" width="26" height="6" fill="#ff9a3a"/>`).join("") },
  slippers: { name: "Dép trong nhà", body: [0, 30].map(d => `<ellipse cx="${105 + d}" cy="366" rx="18" ry="6" fill="#ff9ec4"/><ellipse cx="${105 + d}" cy="358" rx="12" ry="7" fill="#ffd1e3"/><circle cx="${105 + d}" cy="352" r="5" fill="#fff"/>`).join("") },
  /* extras */
  hat: { name: "Mũ rộng vành", head: `<path d="M76 54 Q78 6 120 6 Q162 6 164 54 Z" fill="#f3d27a"/><rect x="77" y="38" width="86" height="11" fill="#ff7a7a"/><ellipse cx="120" cy="54" rx="86" ry="17" fill="#f3d27a" stroke="#d9b24f" stroke-width="2"/>` },
  raincoat: {
    name: "Áo mưa",
    back: `<ellipse cx="120" cy="94" rx="74" ry="72" fill="#ffcf33"/>`,
    body: `<path d="M74 150 Q120 138 166 150 L198 292 Q120 304 42 292 Z" fill="#ffcf33" stroke="#d9a600" stroke-width="2.5"/><circle cx="120" cy="188" r="4" fill="#2f5aa8"/><circle cx="120" cy="214" r="4" fill="#2f5aa8"/><circle cx="120" cy="240" r="4" fill="#2f5aa8"/><path d="M120 156 L120 292" stroke="#d9a600" stroke-width="2"/>`,
    head: `<path d="M50 110 Q46 22 120 20 Q194 22 190 110 Q184 44 120 42 Q56 44 50 110 Z" fill="#ffcf33" stroke="#d9a600" stroke-width="2"/>`,
  },
  jacket: {
    name: "Áo khoác ấm",
    body: `<rect x="58" y="166" width="24" height="80" rx="11" fill="#e8604c" transform="rotate(12 70 168)"/><rect x="158" y="166" width="24" height="80" rx="11" fill="#e8604c" transform="rotate(-12 170 168)"/>
      <path d="M78 156 Q120 146 162 156 L168 272 L72 272 Z" fill="#e8604c"/><path d="M120 156 L120 272" stroke="#a93a2b" stroke-width="3"/>
      <path d="M74 192 L166 192 M73 222 L167 222 M72 252 L168 252" stroke="#cf4e3b" stroke-width="3"/><path d="M96 152 Q120 166 144 152 Q144 142 120 144 Q96 142 96 152 Z" fill="#fff4e8"/>`,
  },
};
const THUMB = {
  top: "52 140 136 130", bottom: "58 244 124 116", shoes: "82 306 76 68",
  hat: "30 0 180 74", raincoat: "36 18 168 286", jacket: "44 140 152 136",
};

function faceSVG(mood) {
  const mouth = mood === "wow" ? `<ellipse cx="120" cy="134" rx="7" ry="8" fill="#c4545b"/>`
    : mood === "oh" ? `<path d="M114 135 Q120 132 126 135" stroke="#c4545b" stroke-width="3" fill="none" stroke-linecap="round"/>`
    : `<path d="M111 131 Q120 139 129 131" stroke="#c4545b" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  return `<g class="eyes"><ellipse cx="100" cy="107" rx="8" ry="9.5" fill="#2a1c14"/><ellipse cx="140" cy="107" rx="8" ry="9.5" fill="#2a1c14"/>
      <circle cx="103" cy="103" r="2.8" fill="#fff"/><circle cx="143" cy="103" r="2.8" fill="#fff"/></g>
    <path d="M90 91 Q100 87 109 91 M131 91 Q140 87 150 91" stroke="${HAIR}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="86" cy="124" rx="12" ry="7" fill="${CHEEK}" opacity=".7"/><ellipse cx="154" cy="124" rx="12" ry="7" fill="${CHEEK}" opacity=".7"/>
    <path d="M118 119 Q120 121 122 119" stroke="#e0a990" stroke-width="2" fill="none" stroke-linecap="round"/>${mouth}`;
}

/* layers: extra.back · bag · hair back · legs · feet/shoes · arms · neck · bottom · top · extra.body · head · face · bangs · extra.head · straps */
function kimSVG(o = {}, cls = "kim", vb = "0 0 240 400") {
  const top = CLOTHES[o.top || "home"], bottom = CLOTHES[o.bottom || "pj"], shoes = o.shoes && CLOTHES[o.shoes], ex = o.extra && CLOTHES[o.extra];
  const arm = (x, a, cx) => `<rect x="${x}" y="166" width="20" height="86" rx="10" fill="${SKIN}" transform="rotate(${a} ${cx} 168)"/>`;
  return `<svg class="${cls}" viewBox="${vb}" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    ${ex && ex.back || ""}
    ${o.bag ? `<rect x="62" y="166" width="116" height="104" rx="26" fill="#ff8fb1" stroke="#e86f97" stroke-width="3"/>` : ""}
    <path d="M54 104 Q50 36 120 32 Q190 36 186 104 L189 156 Q176 166 160 158 L80 158 Q64 166 51 156 Z" fill="${HAIR}"/>
    <rect x="94" y="256" width="22" height="104" rx="10" fill="${SKIN}"/><rect x="124" y="256" width="22" height="104" rx="10" fill="${SKIN}"/>
    ${shoes ? shoes.body : `<ellipse cx="104" cy="362" rx="14" ry="8" fill="${SKIN}"/><ellipse cx="136" cy="362" rx="14" ry="8" fill="${SKIN}"/>`}
    ${arm(60, 12, 70)}${arm(160, -12, 170)}
    <circle cx="51" cy="253" r="11" fill="${SKIN}"/><circle cx="189" cy="253" r="11" fill="${SKIN}"/>
    <rect x="110" y="140" width="20" height="22" fill="${SKIN}"/>
    ${bottom.body}${top.body}${ex && ex.body || ""}
    <ellipse cx="120" cy="102" rx="53" ry="55" fill="${SKIN}"/>
    <g class="face">${faceSVG(o.mood)}</g>
    <path d="M64 98 Q60 44 120 40 Q178 42 178 98 Q172 72 150 62 Q132 84 92 78 Q74 82 64 98 Z" fill="${HAIR}"/>
    <path d="M150 62 Q164 84 176 92" stroke="#3a3644" stroke-width="2" fill="none"/>
    ${ex && ex.head || ""}
    ${o.bag ? `<path d="M94 160 L90 252 M146 160 L150 252" stroke="#e86f97" stroke-width="9" stroke-linecap="round"/>` : ""}
  </svg>`;
}
function thumb(id, kind) {
  const c = CLOTHES[id];
  return `<svg viewBox="${THUMB[kind] || THUMB[id]}" aria-hidden="true">${c.back || ""}${c.body || ""}${c.head || ""}</svg>`;
}

/* ================= weather + rounds ================= */
const WEATHER = {
  sun: { name: "Trời nắng", icon: "☀️", sky: "#7cc8ff", intro: "Ông mặt trời chiếu nắng chang chang!" },
  rain: { name: "Trời mưa", icon: "🌧️", sky: "#8a9bb0", intro: "Trời đang mưa rào rào!" },
  cold: { name: "Trời lạnh", icon: "🌬️", sky: "#b9cfe0", intro: "Gió lạnh thổi vù vù, trời lạnh quá!" },
};
function stepsFor(w) {
  return [
    { kind: "top", slot: "top", chip: "👕", ask: "Bé chọn áo cho Kim nhé!",
      opts: [{ id: "uniform", ok: "Áo đồng phục, đẹp quá!" }, { id: "pink", ok: "Áo hồng xinh xắn!" }, { id: "swim", no: "Đồ bơi để đi bơi cơ, không mặc đi học đâu!" }] },
    { kind: "bottom", slot: "bottom", chip: "👖", ask: "Bây giờ chọn quần hoặc váy nào!",
      opts: [{ id: "shorts", ok: "Quần soóc gọn gàng!" }, { id: "skirt", ok: "Chân váy đỏ xinh quá!" }, { id: "pj", no: "Quần ngủ để mặc đi ngủ thôi!" }] },
    { kind: "shoes", slot: "shoes", chip: "👟", ask: w === "rain" ? "Trời mưa thì đi giày gì nhỉ?" : "Kim đi giày gì đến trường nhỉ?",
      opts: [
        w === "rain" ? { id: "sneakers", no: "Trời mưa, giày vải sẽ ướt hết!" } : { id: "sneakers", ok: "Giày thể thao, chạy nhảy thật vui!" },
        w === "rain" ? { id: "boots", ok: "Đi ủng thì lội nước không ướt chân!" } : { id: "boots", no: "Trời không mưa, đi ủng nóng chân lắm!" },
        { id: "slippers", no: "Dép đi trong nhà dễ trượt ngã lắm!" }] },
    { kind: "extra", slot: "extra", chip: w === "sun" ? "👒" : w === "rain" ? "🧥" : "🧣", ask: { sun: "Trời nắng, Kim cần thêm gì nữa?", rain: "Trời mưa, Kim cần mặc thêm gì?", cold: "Trời lạnh, Kim cần mặc thêm gì cho ấm?" }[w],
      opts: [
        w === "sun" ? { id: "hat", ok: "Đội mũ để không bị nắng chiếu vào đầu!" } : { id: "hat", no: w === "rain" ? "Mũ không che được mưa đâu!" : "Mũ này để che nắng thôi, không ấm đâu." },
        w === "rain" ? { id: "raincoat", ok: "Mặc áo mưa thì không bị ướt!" } : { id: "raincoat", no: "Trời đâu có mưa!" },
        w === "cold" ? { id: "jacket", ok: "Áo khoác ấm áp quá!" } : { id: "jacket", no: w === "sun" ? "Trời nắng mặc áo khoác nóng lắm!" : "Áo khoác sẽ bị ướt mất!" }] },
  ];
}
const PACK = [
  { e: "🥤", n: "Bình nước", ok: "Bình nước, để uống khi khát!" },
  { e: "🍱", n: "Hộp cơm", ok: "Hộp cơm, ăn cho no bụng!" },
  { e: "🖍️", n: "Bút màu", ok: "Bút màu, để tô tranh!" },
  { e: "📒", n: "Quyển vở", ok: "Quyển vở, để vẽ và học!" },
  { e: "🧻", n: "Khăn giấy", ok: "Khăn giấy, để lau tay, lau mũi!" },
  { e: "🎮", n: "Trò chơi", no: "Trò chơi điện tử để ở nhà nhé!" },
  { e: "🍭", n: "Kẹo mút", no: "Kẹo không tốt cho răng, để ở nhà thôi!" },
  { e: "🦆", n: "Vịt tắm", no: "Vịt để chơi lúc tắm cơ!" },
];

let outfit = {};
function setTitle(html) { $("#title").innerHTML = html; }
function badge() { $("#badge").innerHTML = kimSVG({ ...outfit, mood: "smile" }, "", "48 30 144 140"); }

function roomScene(w) {
  const W = WEATHER[w];
  const scene = h(`<div class="scene"><div class="room"></div>
    <div class="window" style="--sky:${W ? W.sky : "#7cc8ff"}"><div class="wx ${w === "sun" ? "sunspin" : ""}">${W ? W.icon : "☀️"}</div></div>
    <div class="kimbox"></div></div>`);
  const win = $(".window", scene);
  if (w === "rain") for (let i = 0; i < 14; i++) { const d = h(`<i class="drop"></i>`); d.style.left = (i * 7.3) % 100 + "%"; d.style.animationDelay = (i * .13) % .7 + "s"; win.appendChild(d); }
  if (w === "cold") for (let i = 0; i < 3; i++) { const l = h(`<i class="leaf">🍂</i>`); l.style.top = 15 + i * 25 + "%"; l.style.animationDelay = i * .8 + "s"; win.appendChild(l); }
  return scene;
}
function drawKim(scene, extraCls = "") {
  const box = $(".kimbox", scene); box.innerHTML = kimSVG(outfit, "kim " + extraCls); badge();
}

/* ---------- home: pick the weather ---------- */
function showHome(greet = true) {
  clearTimers(); stage.innerHTML = ""; $("#homeBtn").hidden = true;
  setTitle(`Bé Kim <em>Đi Học</em>`);
  outfit = { top: "home", bottom: "pj", mood: "smile" };
  const scene = roomScene("sun"); stage.appendChild(scene); drawKim(scene);
  const tray = h(`<div class="tray"></div>`);
  Object.entries(WEATHER).forEach(([k, W]) => {
    const c = h(`<button class="card" aria-label="${W.name}"><div class="emo">${W.icon}</div><small>${W.name}</small>${stars[k] ? '<span class="stars">⭐</span>' : ""}</button>`);
    c.addEventListener("click", () => { sfx.tap(); startDress(k); });
    tray.appendChild(c);
  });
  stage.appendChild(tray);
  if (greet) {
    const n = Object.keys(stars).length;
    say(n === 3 ? "Kim đã đi học cả ngày nắng, ngày mưa và ngày lạnh. Bé giỏi quá! Chơi lại nhé!"
      : n ? "Kim muốn đi học nữa! Hôm nay trời thế nào? Bé chọn đi!"
      : "Chào bé! Tớ là Kim. Sáng nay tớ phải đi học mà vẫn mặc đồ ngủ! Hôm nay trời thế nào? Bé chọn giúp tớ nhé!");
  }
}

/* ---------- dress up ---------- */
function startDress(w) {
  clearTimers(); stage.innerHTML = ""; $("#homeBtn").hidden = false;
  const W = WEATHER[w]; setTitle(`${W.icon} Thay đồ`);
  const scene = roomScene(w); stage.appendChild(scene); drawKim(scene);
  const steps = stepsFor(w);
  const chips = h(`<div class="chips"></div>`);
  steps.forEach(s => chips.appendChild(h(`<div class="chip">${s.chip}</div>`)));
  scene.appendChild(chips);
  const tray = h(`<div class="tray"></div>`); stage.appendChild(tray);
  let i = 0;
  function show() {
    const s = steps[i]; tray.innerHTML = "";
    chips.querySelectorAll(".chip").forEach((c, k) => { c.classList.toggle("on", k === i); c.classList.toggle("got", k < i); });
    shuffle(s.opts).forEach(o => {
      const c = CLOTHES[o.id];
      const card = h(`<button class="card" aria-label="${c.name}">${thumb(o.id, s.kind === "extra" ? o.id : s.kind)}<small>${c.name}</small></button>`);
      card.addEventListener("click", () => {
        if (tray.dataset.busy) return;
        if (o.no) {
          sfx.oops(); card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
          outfit.mood = "oh"; drawKim(scene); say(o.no); return;
        }
        tray.dataset.busy = "1"; card.classList.add("picked"); sfx.swish();
        outfit[s.slot] = o.id; outfit.mood = "wow"; drawKim(scene, "hop"); sfx.ding();
        sparkle(scene, "50%", "40%");
        say(o.ok, () => {
          delete tray.dataset.busy; outfit.mood = "smile"; drawKim(scene); i++;
          if (i < steps.length) { show(); } else {
            chips.querySelectorAll(".chip").forEach(c => { c.classList.remove("on"); c.classList.add("got"); });
            tray.innerHTML = ""; say("Kim mặc đẹp quá! Giờ mình chuẩn bị cặp sách nhé!", () => startPack(w));
          }
        });
      });
      tray.appendChild(card);
    });
    say(s.ask);
  }
  say(`${W.intro} Mình thay đồ cho Kim nào!`, show);
}

/* ---------- pack the school bag ---------- */
function startPack(w) {
  clearTimers(); stage.innerHTML = "";
  setTitle(`🎒 Chuẩn bị cặp`);
  const scene = roomScene(w); stage.appendChild(scene); drawKim(scene);
  const kim = $(".kim", scene); kim.style.left = "24%"; kim.style.height = "56%";
  const bag = h(`<div class="bag"><svg viewBox="0 0 160 170" aria-hidden="true">
      <path d="M50 40 Q50 8 80 8 Q110 8 110 40" stroke="#e86f97" stroke-width="10" fill="none"/>
      <rect x="10" y="34" width="140" height="132" rx="34" fill="#ff8fb1" stroke="#e86f97" stroke-width="4"/>
      <rect x="34" y="96" width="92" height="56" rx="18" fill="#ffb3cb" stroke="#e86f97" stroke-width="3"/>
      <circle cx="80" cy="112" r="6" fill="#ffd84d"/><path d="M20 52 Q80 70 140 52" stroke="#e86f97" stroke-width="4" fill="none"/>
    </svg><div class="count" hidden>0</div></div>`);
  scene.appendChild(bag);
  const spots = shuffle([[14, 14], [38, 14], [62, 14], [86, 14], [14, 35], [38, 35], [62, 35], [86, 35]]);
  const items = shuffle(PACK);
  let got = 0; const need = PACK.filter(p => p.ok).length;
  items.forEach((p, k) => {
    const el = h(`<button class="item" aria-label="${p.n}">${p.e}<small>${p.n}</small></button>`);
    el.style.left = spots[k][0] + "%"; el.style.top = spots[k][1] + "%";
    el.addEventListener("click", () => {
      if (el.dataset.used) return;
      if (p.no) { sfx.oops(); el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); say(p.no); return; }
      el.dataset.used = "1"; sfx.swish();
      const sr = scene.getBoundingClientRect(), br = bag.getBoundingClientRect();
      el.style.left = ((br.left + br.width / 2 - sr.left) / sr.width * 100) + "%";
      el.style.top = ((br.top + br.height * .45 - sr.top) / sr.height * 100) + "%";
      el.style.transform = "scale(.3)"; el.style.opacity = "0";
      later(() => {
        el.remove(); sfx.plop(); got++;
        bag.classList.remove("bump"); void bag.offsetWidth; bag.classList.add("bump");
        const c = $(".count", bag); c.hidden = false; c.textContent = got;
        const num = ["Một", "Hai", "Ba", "Bốn", "Năm"][got - 1];
        if (got < need) say(`${num}! ${p.ok}`);
        else say(`${num}! ${p.ok} Cặp sách đã sẵn sàng rồi!`, () => { outfit.bag = true; startSchool(w); });
      }, 620);
    });
    scene.appendChild(el);
  });
  say("Bé chạm vào những đồ Kim cần mang đến trường để cho vào cặp nhé! Cẩn thận, có đồ không cần mang đâu.");
}

/* ---------- arrive at school ---------- */
function startSchool(w) {
  clearTimers(); stage.innerHTML = "";
  setTitle(`🏫 Đến trường`);
  outfit.mood = "smile";
  const scene = h(`<div class="scene"><div class="school">
      <div class="building"><div class="sign">TRƯỜNG MẦM NON</div><div class="win" style="left:12%"></div><div class="win" style="right:12%"></div><div class="door"></div></div>
    </div><div class="kimbox"></div><div class="teacher" aria-hidden="true">👩‍🏫</div></div>`);
  stage.appendChild(scene); drawKim(scene, "hop");
  const kim = $(".kim", scene); kim.style.left = "32%"; kim.style.height = "60%";
  sfx.bell();
  const tray = h(`<div class="tray"><button class="big-btn nudge">👋 Chào cô</button></div>`);
  stage.appendChild(tray);
  say("Kim đến trường rồi! Gặp cô giáo thì mình nói gì nhỉ? Bé chạm vào nút Chào cô nhé!");
  $("button", tray).addEventListener("click", () => {
    tray.remove(); sfx.tap(); outfit.mood = "wow"; drawKim(scene, "hop");
    const k = $(".kim", scene); k.style.left = "32%"; k.style.height = "60%";
    const b1 = h(`<div class="say" style="left:12%;top:8%">Con chào cô ạ!</div>`); scene.appendChild(b1);
    say("Con chào cô ạ!", () => {
      const b2 = h(`<div class="say" style="right:6%;top:14%">Chào Kim! 💛</div>`); scene.appendChild(b2);
      say("Chào Kim! Hôm nay Kim mặc quần áo hợp thời tiết, lại chuẩn bị cặp sách gọn gàng nữa. Giỏi quá!", () => finish(w));
    });
  });
}

function finish(w) {
  stars[w] = 1; saveStars(); sfx.cheer();
  const all = Object.keys(stars).length === 3;
  const p = h(`<div class="party" role="dialog" aria-label="Hoàn thành"><div class="box">
      <div class="big">${all ? "🏆" : WEATHER[w].icon}</div><h2>${all ? "Bé giỏi quá!" : "Hoan hô!"}</h2>
      <div style="font-size:42px">⭐⭐⭐</div><button class="round" aria-label="Chơi tiếp">🏠</button></div></div>`);
  document.body.appendChild(p);
  for (let i = 0; i < 22; i++) {
    const c = h(`<div class="confetti">${["⭐", "🎈", "🍋", "🌟", "🎒"][i % 5]}</div>`);
    c.style.left = Math.random() * 100 + "vw"; c.style.animationDuration = 2 + Math.random() * 2.5 + "s"; c.style.animationDelay = Math.random() * .8 + "s";
    document.body.appendChild(c); setTimeout(() => c.remove(), 5500);
  }
  say(all ? "Bé đã giúp Kim đi học vào ngày nắng, ngày mưa và ngày lạnh. Bé thật là giỏi!" : "Bé được một ngôi sao! Thử chọn thời tiết khác nhé!");
  $(".round", p).addEventListener("click", () => { sfx.tap(); p.remove(); showHome(); });
}

/* ================= wiring ================= */
$("#homeBtn").addEventListener("click", () => { sfx.tap(); document.querySelectorAll(".party,.confetti").forEach(n => n.remove()); showHome(); });
$("#bubble").addEventListener("click", () => say(lastLine));
$("#soundBtn").addEventListener("click", () => {
  soundOn = !soundOn; $("#soundBtn").textContent = soundOn ? "🔊" : "🔇";
  if (!soundOn && "speechSynthesis" in window) speechSynthesis.cancel(); else sfx.tap();
});
$("#portrait").innerHTML = kimSVG({ top: "home", bottom: "pj", mood: "smile" }, "", "30 0 180 400");
$("#portrait svg").style.height = "100%";
$("#playBtn").addEventListener("click", () => { ac(); sfx.cheer(); $("#start").remove(); showHome(); });
showHome(false);
})();
</script>
</body>
</html>
