# /etc/nut/upsmon.conf — quyền 640, owner root:nut.
MONITOR ups@localhost 1 upsmon_local CHANGE_ME_LOCAL primary
MINSUPPLIES 1
SHUTDOWNCMD "/opt/homelab/bin/nut-shutdown.sh"
POWERDOWNFLAG /etc/killpower
FINALDELAY 5
# Gửi thông báo sự kiện qua Telegram
NOTIFYCMD /opt/homelab/bin/nut-notify.sh
NOTIFYFLAG ONLINE SYSLOG+EXEC
NOTIFYFLAG ONBATT SYSLOG+EXEC
NOTIFYFLAG LOWBATT SYSLOG+EXEC
NOTIFYFLAG COMMBAD SYSLOG+EXEC
NOTIFYFLAG REPLBATT SYSLOG+EXEC
NOTIFYFLAG NOCOMM SYSLOG+EXEC
