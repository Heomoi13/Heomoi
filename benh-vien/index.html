<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bệnh Viện Gấu Bông</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen picture-book app — header, nurse speech bubble, stage, tool tray. Single bright theme on purpose. */
:root {
  color-scheme: light;
  --bg: #d7f1ec;        /* mint hospital wall */
  --paper: #ffffff;
  --ink: #1f3b4d;       /* deep teal-navy text */
  --ink-soft: #4f6b7a;
  --teal: #20a596;      /* scrubs */
  --coral: #ff6b6b;     /* red cross */
  --sun: #ffc94d;
  --sky: #8fd3ff;
  --lilac: #b48cf2;
  --line: #b8e0d8;
  --shadow: 0 6px 0 rgba(31,59,77,.18);
  --font: "Baloo 2", "Nunito", "Segoe UI Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --r: 28px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  background-image: radial-gradient(circle at 20px 20px, rgba(255,255,255,.55) 3px, transparent 4px);
  background-size: 40px 40px;
}
button { font-family: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 5px solid var(--sun); outline-offset: 3px; }

#app {
  height: 100%; display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1100px; margin: 0 auto;
}

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 12px; }
.round {
  width: 64px; height: 64px; flex: none; border-radius: 50%; background: var(--paper);
  font-size: 32px; box-shadow: var(--shadow); display: grid; place-items: center;
  transition: transform .12s;
}
.round:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(31,59,77,.18); }
.title {
  flex: 1; min-width: 0; text-align: center; font-weight: 800; line-height: 1;
  font-size: clamp(24px, 5.5vw, 44px); letter-spacing: .01em; text-wrap: balance;
}
.title .cross { color: var(--coral); }

/* ---------- nurse bubble ---------- */
.guide { display: flex; align-items: center; gap: 10px; }
.nurse { font-size: 52px; line-height: 1; flex: none; filter: drop-shadow(0 3px 0 rgba(0,0,0,.12)); }
.bubble {
  flex: 1; min-width: 0; background: var(--paper); border-radius: 22px; padding: 10px 16px;
  font-size: clamp(18px, 3.6vw, 26px); font-weight: 700; line-height: 1.25; position: relative;
  box-shadow: var(--shadow); text-align: left;
}
.bubble::before {
  content: ""; position: absolute; left: -12px; top: 50%; translate: 0 -50%;
  border: 10px solid transparent; border-right: 14px solid var(--paper); border-left: 0;
}
.bubble .again { float: right; font-size: 24px; margin-left: 8px; opacity: .7; }

/* ---------- stage ---------- */
.stage { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; gap: 10px; }
.scene {
  flex: 1; min-height: 0; position: relative; border-radius: var(--r); overflow: hidden;
  background: var(--paper); box-shadow: var(--shadow);
}
.scene svg.main { position: absolute; inset: 0; width: 100%; height: 100%; }
.tray { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.tool {
  min-width: 92px; height: 92px; padding: 6px 10px; border-radius: 26px; background: var(--paper);
  box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 44px; line-height: 1; position: relative; transition: transform .12s, opacity .2s;
}
.tool small { font-size: 15px; font-weight: 700; margin-top: 4px; color: var(--ink-soft); }
.tool:active { transform: translateY(4px); }
.tool.done::after {
  content: "✔"; position: absolute; top: -6px; right: -6px; width: 30px; height: 30px; border-radius: 50%;
  background: var(--teal); color: #fff; font-size: 18px; display: grid; place-items: center;
}
.tool.next { animation: nudge 1.1s ease-in-out infinite; outline: 4px solid var(--sun); }
.tool.dim { opacity: .45; }
@keyframes nudge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

/* ---------- home: hospital building ---------- */
.hospital { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; }
.sign {
  background: var(--paper); border-radius: 22px 22px 0 0; padding: 8px 26px 4px; box-shadow: var(--shadow);
  font-weight: 800; font-size: clamp(18px, 3.4vw, 26px); display: flex; align-items: center; gap: 10px;
}
.sign b { color: #fff; background: var(--coral); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; font-size: 30px; line-height: 1; }
.building {
  width: 100%; flex: 1; min-height: 0; background: #f6fbfa; border-radius: var(--r); box-shadow: var(--shadow);
  border: 6px solid var(--paper); padding: 14px; display: grid; gap: 14px;
  grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr;
}
.door {
  border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: clamp(44px, 8vw, 76px); line-height: 1; position: relative; color: var(--ink);
  background: var(--c); box-shadow: inset 0 -8px 0 rgba(0,0,0,.12), var(--shadow); min-height: 0;
  transition: transform .15s;
}
.door span { font-size: clamp(16px, 2.6vw, 24px); font-weight: 800; background: rgba(255,255,255,.85); padding: 2px 12px; border-radius: 99px; margin-top: 6px; }
.door:active { transform: scale(.96); }
.door .star { position: absolute; top: 6px; right: 10px; font-size: 32px; }

.shelf { display: flex; justify-content: center; gap: 8px; align-items: center; flex-wrap: wrap; }
.slot {
  width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.6); border: 3px dashed var(--line);
  display: grid; place-items: center; font-size: 30px;
}
.slot.got { background: var(--paper); border: 3px solid var(--sun); animation: pop .5s; }
@keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }

/* ---------- start screen ---------- */
.start {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px;
  background-image: radial-gradient(circle at 20px 20px, rgba(255,255,255,.55) 3px, transparent 4px); background-size: 40px 40px;
}
.start h1 { margin: 0; font-size: clamp(36px, 8vw, 72px); line-height: 1; font-weight: 800; text-wrap: balance; }
.start h1 em { font-style: normal; color: var(--coral); }
.start p { margin: 0; font-size: clamp(18px, 3vw, 24px); color: var(--ink-soft); max-width: 30em; }
.play {
  width: 160px; height: 160px; border-radius: 50%; background: var(--coral); color: #fff; font-size: 72px;
  box-shadow: 0 10px 0 #c94848; animation: nudge 1.4s ease-in-out infinite; display: grid; place-items: center;
}
.play:active { transform: translateY(8px); box-shadow: 0 2px 0 #c94848; }

/* ---------- celebration ---------- */
.party {
  position: fixed; inset: 0; z-index: 40; background: rgba(31,59,77,.55); display: grid; place-items: center; padding: 20px;
}
.party .card {
  background: var(--paper); border-radius: 36px; padding: 24px 28px; text-align: center; box-shadow: 0 12px 0 rgba(0,0,0,.2);
  display: flex; flex-direction: column; align-items: center; gap: 10px; animation: pop .5s; max-width: 92vw;
}
.party .big { font-size: 110px; line-height: 1; }
.party h2 { margin: 0; font-size: clamp(30px, 6vw, 48px); line-height: 1.05; }
.party .round { width: 90px; height: 90px; font-size: 46px; background: var(--sun); }
.confetti { position: fixed; top: -60px; font-size: 40px; z-index: 45; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }

/* ---------- room specifics ---------- */
.readout {
  position: absolute; top: 14px; right: 14px; background: var(--ink); color: #fff; border-radius: 18px;
  padding: 6px 16px; font-size: clamp(26px, 5vw, 42px); font-weight: 800; font-variant-numeric: tabular-nums;
  animation: pop .4s;
}
.pulse { animation: beat .55s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes beat { 0%,100% { transform: scale(1); } 30% { transform: scale(1.25); } }
.blink { animation: blink .35s steps(1) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.wobble { animation: wob .5s ease-in-out 2; transform-box: fill-box; transform-origin: center bottom; }
@keyframes wob { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }

/* ambulance */
.road { position: absolute; inset: 0; background: linear-gradient(#bfe8ff 0 62%, #8fcf7a 62% 70%, #6b7a86 70% 100%); }
.road::after { content: ""; position: absolute; left: 0; right: 0; top: 84%; height: 8px;
  background: repeating-linear-gradient(90deg, #fff 0 40px, transparent 40px 80px); }
.road .hosp { position: absolute; left: 4%; top: 22%; font-size: clamp(60px, 12vw, 110px); }
.road .bearbox { position: absolute; left: 50%; bottom: 14%; width: clamp(90px, 18vw, 150px); translate: -50% 0; }
.amb { position: absolute; bottom: 12%; right: -40%; font-size: clamp(90px, 18vw, 160px); line-height: 1; transition: right 2.2s cubic-bezier(.2,.8,.3,1), transform .2s; background: none; padding: 0; }
.amb .lights { position: absolute; top: 10%; left: 40%; display: flex; gap: 6px; }
.amb .lights i { width: 18px; height: 18px; border-radius: 50%; background: #ff3b3b; display: block; }
.amb .lights i + i { background: #3b8bff; animation-delay: .175s; }
.phone {
  position: absolute; top: 5%; bottom: 5%; left: 50%; translate: -50% 0; width: min(330px, 86%); background: var(--ink); border-radius: 34px;
  padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 0 rgba(0,0,0,.25);
}
.phone .screen { background: #eaf7ff; border-radius: 20px; height: 70px; display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 48px; font-weight: 800; font-variant-numeric: tabular-nums; }
.phone .screen i { width: 40px; border-bottom: 5px solid var(--ink-soft); text-align: center; font-style: normal; line-height: 1; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; min-height: 0; }
.keys button { border-radius: 50%; background: #3c5a6d; color: #fff; font-size: clamp(24px, 4.5vw, 34px); font-weight: 800; aspect-ratio: 1; max-height: 100%; justify-self: center; height: 100%; max-width: 100%; }
.keys button.glow { background: var(--sun); color: var(--ink); animation: nudge 1s infinite; }
.keys button.k0 { grid-column: 2; }

/* handwashing */
.sink { position: absolute; inset: 0; background: linear-gradient(#e9f7ff 0 72%, #cfe6ef 72%); }
.sink .basin { position: absolute; left: 10%; right: 10%; bottom: 4%; height: 28%; background: #fff; border-radius: 0 0 50% 50%; border: 6px solid #b9d7e3; }
.sink .faucet { position: absolute; left: 50%; top: 2%; translate: -50% 0; font-size: 64px; }
.sink .stream { position: absolute; left: 50%; top: 15%; width: 26px; height: 52%; translate: -50% 0; border-radius: 13px;
  background: linear-gradient(90deg, #8fd3ff, #d6f0ff, #8fd3ff); opacity: .85; animation: flow .3s linear infinite; }
@keyframes flow { 50% { opacity: .6; } }
.sink .hands { position: absolute; left: 50%; top: 52%; translate: -50% -50%; font-size: clamp(120px, 24vw, 210px); line-height: 1; }
.germ { position: absolute; font-size: clamp(38px, 7vw, 56px); background: none; padding: 6px; line-height: 1; animation: jiggle 1.2s ease-in-out infinite; translate: -50% -50%; }
@keyframes jiggle { 50% { transform: rotate(18deg) scale(1.1); } }
.bub { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, rgba(200,235,255,.7)); border: 2px solid rgba(143,211,255,.9); pointer-events: none; translate: -50% -50%; animation: pop .4s; }
.sparkle { position: absolute; font-size: 40px; pointer-events: none; translate: -50% -50%; animation: rise 1s ease-out forwards; }
@keyframes rise { to { transform: translateY(-60px) scale(1.4); opacity: 0; } }

/* rest room */
.night { position: absolute; inset: 0; background: rgba(20,30,70,.72); opacity: 0; transition: opacity 1s; pointer-events: none; display: flex; justify-content: flex-end; padding: 18px; font-size: 64px; }
.night.on { opacity: 1; }

@media (max-width: 560px) and (orientation: portrait) {
  .building { grid-template-columns: repeat(2, 1fr); }
  .slot { width: 44px; height: 44px; font-size: 24px; }
  .tool { min-width: 0; width: 64px; height: 76px; padding: 4px; font-size: 34px; border-radius: 20px; }
  .tool small { font-size: 12px; }
  .tray { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button class="round" id="homeBtn" aria-label="Về bệnh viện" hidden>🏠</button>
    <div class="title" id="title"><span class="cross">✚</span> Bệnh Viện Gấu Bông</div>
    <button class="round" id="soundBtn" aria-label="Bật hoặc tắt tiếng">🔊</button>
  </div>
  <div class="guide">
    <div class="nurse" aria-hidden="true">👩‍⚕️</div>
    <button class="bubble" id="bubble" aria-live="polite"><span class="again" aria-hidden="true">🔁</span><span id="bubbleText">Xin chào bé!</span></button>
  </div>
  <div class="stage" id="stage"></div>
</div>

<div class="start" id="start">
  <div style="font-size:90px;line-height:1">🏥🧸</div>
  <h1>Bệnh Viện <em>Gấu Bông</em></h1>
  <p>Bé làm bác sĩ nhỏ, giúp bạn Gấu Bông khỏe lại và tìm hiểu bệnh viện làm gì.</p>
  <button class="play" id="playBtn" aria-label="Bắt đầu chơi">▶</button>
</div>

<script>
(() => {
"use strict";

/* ================= storage (best effort) ================= */
const KEY = "benhvien-gaubong-v1";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
function saveDone() { try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) {} }

/* ================= sound ================= */
let soundOn = true, actx = null;
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function tone(f, dur = .15, type = "sine", vol = .2, at = 0, f2) {
  if (!soundOn) return; const c = ac(); if (!c) return;
  const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur = .4, vol = .15, at = 0, freq = 1200) {
  if (!soundOn) return; const c = ac(); if (!c) return;
  const b = c.createBuffer(1, c.sampleRate * dur, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), t = c.currentTime + at;
  s.buffer = b; f.type = "bandpass"; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f).connect(g).connect(c.destination); s.start(t);
}
const sfx = {
  pop: () => tone(500, .12, "sine", .25, 0, 1000),
  tap: () => tone(700, .08, "triangle", .15),
  ding: () => { tone(880, .25, "sine", .2); tone(1320, .35, "sine", .15, .12); },
  oops: () => tone(300, .2, "sine", .15, 0, 220),
  cheer: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .22, "triangle", .2, i * .11)),
  heart: () => { for (let i = 0; i < 4; i++) { tone(70, .12, "sine", .6, i * .7); tone(60, .14, "sine", .45, i * .7 + .17); } },
  siren: () => { for (let i = 0; i < 4; i++) { tone(700, .4, "square", .06, i * .8, 950); tone(950, .4, "square", .06, i * .8 + .4, 700); } },
  water: () => noise(1.2, .12, 0, 2500),
  ring: () => { for (let i = 0; i < 2; i++) { tone(440, .35, "sine", .12, i * .55); tone(480, .35, "sine", .12, i * .55); } },
  scrub: () => noise(.25, .1, 0, 4000),
  beep: () => tone(1500, .1, "square", .07),
  zap: () => tone(1200, .6, "sawtooth", .05, 0, 200),
};

/* ================= voice ================= */
let viVoice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  viVoice = vs.find(v => /^vi/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let lastLine = "";
function say(text, then) {
  lastLine = text;
  const el = document.getElementById("bubbleText");
  el.textContent = text;
  const b = document.getElementById("bubble"); b.classList.remove("wobble"); void b.offsetWidth;
  if (!soundOn || !("speechSynthesis" in window)) { if (then) setTimeout(then, 600 + text.length * 45); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[^\p{L}\p{N}\s.,!?°]/gu, ""));
    u.lang = "vi-VN"; if (viVoice) u.voice = viVoice; u.rate = .92; u.pitch = 1.15;
    let fired = false; const go = () => { if (!fired) { fired = true; then && then(); } };
    u.onend = go; u.onerror = go;
    if (then) setTimeout(go, 1500 + text.length * 90); // safety if onend never fires
    speechSynthesis.speak(u);
  } catch (e) { if (then) setTimeout(then, 800); }
}

/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const stage = $("#stage");
let timers = [];
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function h(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function svgPoint(svg, e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function sparkleAt(parent, x, y, ch = "✨") {
  const s = h(`<div class="sparkle">${ch}</div>`); s.style.left = x; s.style.top = y;
  parent.appendChild(s); setTimeout(() => s.remove(), 1000);
}

/* ================= the bear ================= */
const FUR = "#c98b5a", LIGHT = "#efcfa9", DARK = "#5a3a22";
function faceSVG(mood) {
  const eyes = mood === "sleep"
    ? `<path d="M70 72 Q78 79 86 72 M114 72 Q122 79 130 72" stroke="${DARK}" stroke-width="4" fill="none" stroke-linecap="round"/>`
    : `<circle cx="78" cy="72" r="7" fill="${DARK}"/><circle cx="122" cy="72" r="7" fill="${DARK}"/>
       <circle cx="80" cy="70" r="2.4" fill="#fff"/><circle cx="124" cy="70" r="2.4" fill="#fff"/>`;
  const brows = (mood === "sad" || mood === "sick")
    ? `<path d="M68 62 L86 56 M132 62 L114 56" stroke="${DARK}" stroke-width="4" stroke-linecap="round"/>` : "";
  const mouths = {
    happy: `<path d="M86 106 Q100 121 114 106" stroke="${DARK}" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    sad: `<path d="M88 116 Q100 105 112 116" stroke="${DARK}" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    sick: `<path d="M88 114 Q94 109 100 114 Q106 119 112 114" stroke="${DARK}" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    open: `<ellipse cx="100" cy="113" rx="11" ry="14" fill="#7a2e2e"/><ellipse cx="100" cy="121" rx="7" ry="4.5" fill="#ff8a8a"/>`,
    sleep: `<path d="M93 110 Q100 114 107 110" stroke="${DARK}" stroke-width="4" fill="none" stroke-linecap="round"/>`,
  };
  const cheeks = mood === "sick" ? "#ff5a5a" : "#ff9a9a";
  return `${eyes}${brows}
    <circle cx="66" cy="96" r="9" fill="${cheeks}" opacity="${mood === "sick" ? .75 : .5}"/>
    <circle cx="134" cy="96" r="9" fill="${cheeks}" opacity="${mood === "sick" ? .75 : .5}"/>
    <ellipse cx="100" cy="91" rx="9" ry="6.5" fill="${DARK}"/>
    ${mouths[mood] || mouths.happy}`;
}
function bearSVG({ mood = "happy", extra = "", under = "", vb = "0 0 200 280", cls = "main" } = {}) {
  return `<svg class="${cls}" viewBox="${vb}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    ${under}
    <g class="bear">
      <ellipse cx="70" cy="250" rx="24" ry="17" fill="${FUR}"/><ellipse cx="130" cy="250" rx="24" ry="17" fill="${FUR}"/>
      <ellipse cx="70" cy="254" rx="13" ry="9" fill="${LIGHT}"/><ellipse cx="130" cy="254" rx="13" ry="9" fill="${LIGHT}"/>
      <ellipse cx="44" cy="172" rx="18" ry="34" fill="${FUR}" transform="rotate(25 44 172)"/>

/* tool tray helper: steps run in order; the next one glows */
function makeTray(steps, onAll) {
  const tray = h(`<div class="tray"></div>`);
  let i = 0;
  const btns = steps.map((s, k) => {
    const b = h(`<button class="tool" aria-label="${s.label}">${s.icon}<small>${s.label}</small></button>`);
    b.addEventListener("click", () => {
      if (b.classList.contains("done") || tray.dataset.busy) return;
      if (k !== i && steps.ordered !== false) { sfx.oops(); say(`Chưa đâu bé ơi. Chạm vào ${steps[i].label} trước nhé!`); return; }
      sfx.tap(); tray.dataset.busy = "1";
      s.act(() => {
        delete tray.dataset.busy; b.classList.add("done"); b.classList.remove("next");
        i = steps.findIndex((_, j) => !btns[j].classList.contains("done"));
        if (i === -1) { later(onAll, 600); } else refresh();
      });
    });
    return b;
  });
  function refresh() {
    btns.forEach((b, k) => {
      b.classList.toggle("next", k === i && steps.ordered !== false);
      b.classList.toggle("dim", steps.ordered !== false && k !== i && !b.classList.contains("done"));
    });
  }
  btns.forEach(b => tray.appendChild(b)); refresh();
  return tray;
}

  const svgStr = `<svg class="main" viewBox="0 0 200 280" preserveAspectRatio="xMidYMid meet" aria-hidden="true" style="touch-action:none">

      if (g.dataset.done) return; g.dataset.done = "1";
      const s = spots[+g.dataset.i], rect = svg.getBoundingClientRect(), sr = scene.getBoundingClientRect();
      const pt = svg.createSVGPoint(); pt.x = s.x; pt.y = s.y; const sp = pt.matrixTransform(svg.getScreenCTM());
      sparkleAt(scene, sp.x - sr.left + "px", sp.y - sr.top + "px", "💦");
      sfx.water();
      setTimeout(() => {
        g.querySelector(".scrape").setAttribute("hidden", ""); g.querySelector(".band").removeAttribute("hidden");
        g.querySelector(".band").style.animation = "pop .4s"; sfx.pop(); count++;
        if (count < spots.length) say(["Một", "Hai", "Ba"][count - 1] + "! Rửa sạch vết thương, rồi dán băng.");
        else {
          setFace(svg, "happy"); say("Bốn! Dán xong hết rồi. Bạn Gấu hết đau rồi!");
          later(() => finish(r, "Khi bị trầy xước, mình rửa sạch rồi dán băng để vết thương mau lành."), 1600);
        }
      }, 450);
      void rect;
    });
  });
  say("Bạn Gấu bị trầy xước bốn chỗ. Bé tìm chỗ màu đỏ và chạm vào để dán băng nhé!");
}

/* ---------- 6. Rest room ---------- */
function roomRest(r) {
  const under = `<rect x="-60" y="150" width="320" height="140" rx="10" fill="#e8f0f7"/><rect x="-60" y="140" width="40" height="150" rx="8" fill="#b48cf2"/>
    <rect x="220" y="140" width="40" height="150" rx="8" fill="#b48cf2"/><ellipse cx="100" cy="40" rx="80" ry="30" fill="#fff" opacity=".9" transform="translate(0 60)"/>`;
  const extra = `<g id="blanket"><rect x="-40" y="170" width="280" height="110" rx="20" fill="#8fd3ff"/>
      <g fill="#ffffff" opacity=".7"><circle cx="20" cy="210" r="7"/><circle cx="70" cy="240" r="7"/><circle cx="130" cy="205" r="7"/><circle cx="180" cy="240" r="7"/></g></g>
    <g id="cup" hidden><rect x="160" y="112" width="26" height="34" rx="5" fill="#fff" stroke="#9fb3c4" stroke-width="3"/><rect x="163" y="122" width="20" height="21" rx="3" fill="#8fd3ff"/></g>
    <g id="spoon" hidden><ellipse cx="128" cy="116" rx="14" ry="9" fill="#d0d8e0"/><ellipse cx="128" cy="116" rx="9" ry="5" fill="#ff8ab0"/><rect x="140" y="113" width="44" height="6" rx="3" fill="#d0d8e0"/></g>
    <text id="zzz" x="150" y="30" font-size="28" font-weight="800" fill="#ffffff" hidden>z z Z</text>`;
  const scene = h(`<div class="scene">${bearSVG({ mood: "sick", under, extra, vb: "0 0 200 280" })}<div class="night">🌙</div></div>`);
  stage.appendChild(scene);
  const svg = $("svg", scene), night = $(".night", scene);
  const toggle = (id, on) => svg.querySelector("#" + id).toggleAttribute("hidden", !on);
  const steps = [
    { icon: "💊", label: "Uống thuốc", act: ok => { toggle("spoon", true); setFace(svg, "open"); sfx.pop(); say("Uống thuốc bác sĩ cho nào. Nhớ nhé, chỉ uống thuốc khi bác sĩ hoặc bố mẹ đưa cho mình thôi!", () => { toggle("spoon", false); setFace(svg, "sick"); ok(); }); } },
    { icon: "🥛", label: "Uống nước", act: ok => { toggle("cup", true); sfx.water(); say("Uống thật nhiều nước để mau khỏe. Ực ực!", () => { toggle("cup", false); ok(); }); } },
    { icon: "💡", label: "Tắt đèn", act: ok => { night.classList.add("on"); setFace(svg, "sleep"); toggle("zzz", true); say("Tắt đèn đi ngủ nào. Chúc bạn Gấu ngủ ngon!", ok); } },
  ];
  const tray = makeTray(steps, () => {
    later(() => {
      night.innerHTML = "☀️"; night.classList.remove("on"); toggle("zzz", false); setFace(svg, "happy");
      svg.querySelector("#blanket").style.transform = "translateY(60px)"; svg.querySelector("#blanket").style.transition = "transform 1s";
      sfx.ding();
      say("Ò ó o! Trời sáng rồi. Bạn Gấu khỏe rồi!", () => finish(r, "Ngủ đủ giấc, uống thuốc đúng cách giúp mình mau khỏe. Bạn Gấu được về nhà rồi!"));
    }, 1800);
  });
  stage.appendChild(tray);
  say("Bạn Gấu cần nghỉ ngơi ở bệnh viện. Bé chăm sóc bạn ấy nhé! Đầu tiên là uống thuốc.");
}

/* ================= wiring ================= */
$("#homeBtn").addEventListener("click", () => {
  sfx.tap(); document.querySelectorAll(".party, .confetti").forEach(n => n.remove()); showHome();
});
$("#bubble").addEventListener("click", () => say(lastLine));
$("#soundBtn").addEventListener("click", () => {
  soundOn = !soundOn; $("#soundBtn").textContent = soundOn ? "🔊" : "🔇";
  if (!soundOn && "speechSynthesis" in window) speechSynthesis.cancel(); else sfx.tap();
});
$("#playBtn").addEventListener("click", () => {
  ac(); sfx.cheer(); $("#start").remove(); showHome();
});
showHome(false);
})();
</script>
