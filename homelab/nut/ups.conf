# /etc/nut/ups.conf — UPS cắm USB vào homeserver.
# Kiểm tra driver phù hợp bằng: sudo nut-scanner -U
[ups]
  driver = usbhid-ups
  port = auto
  desc = "Homelab UPS (server + NAS + Deco)"
  # Tắt máy khi pin còn 50% hoặc còn dưới 5 phút, thay vì chờ UPS tự báo pin yếu (~10%).
  # Nếu UPS không cho phép override, xoá 3 dòng dưới và chỉnh ngưỡng trong upsmon/UGOS.
  ignorelb
  override.battery.charge.low = 50
  override.battery.runtime.low = 300
